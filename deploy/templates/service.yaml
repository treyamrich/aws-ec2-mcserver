apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mcServer.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: mc-server
spec:
  # LoadBalancer so k3s klipper-lb svclb DaemonSet binds port 25565 on
  # every node's host network. Combined with wildcard lan-dns CoreDNS
  # records (`*.lan.local` → Traefik LB IP, `*.ts.lan.local` → shmillion
  # tailscale IP), this gives stable per-subdomain access:
  #   - LAN:       <name>.lan.local:25565
  #   - Tailscale: <name>.ts.lan.local:25565
  # The Minecraft client supports DNS hostnames natively (no SRV record
  # needed). Pick any subdomain prefix you want — wildcard handles all.
  type: LoadBalancer
  ports:
  - name: minecraft
    port: {{ .Values.mcServer.service.port }}
    targetPort: {{ .Values.mcServer.service.port }}
    protocol: TCP
  - name: minecraft-query
    port: {{ .Values.mcServer.service.port }}
    targetPort: {{ .Values.mcServer.service.port }}
    protocol: UDP
  selector:
    app: mc-server
