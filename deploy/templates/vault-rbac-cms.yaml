# App-owned KV seeding (Phase 2 encrypted) for mc-server-controller.
#
# RBAC stays platform-owned: the chart's SA name is 'mc-server-controller'
# and the Vault role is bare-named 'mc-server-controller' (per platform
# files/roles/mc-server-controller.txt) — migrating that would change the
# role name and require coordinating with whatever in-process Vault auth
# the controller uses. Just KV migration here.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mc-server-controller-vault-seed-spec
  namespace: {{ .Values.namespace }}
  labels:
    vault.homelab/seed-spec: "true"
data:
