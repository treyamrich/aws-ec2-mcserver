name: build
# Build mc-server-controller container image and push to the in-cluster
# registry. Tag bump in deploy/values.yaml is intentionally manual for
# now — chart consumes two distinct images (discord + http) under
# different repository names; tagging needs follow-up coordination.
#
# Trigger: push to master.
on:
  push:
    branches: [master]
    paths-ignore:
      - "deploy/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

jobs:
  build:
    # No per-repo ARC scale set yet for aws-ec2-mcserver — use the
    # shared default scale set (runnerScaleSetName: in-cluster, defined
    # in argoapps-homelab/_charts/platform/arc-runners-default).
    runs-on: in-cluster
    permissions:
      contents: read
    env:
      REGISTRY: 192.168.4.43:5000
      IMAGE: mc-server-controller
      BUILDKIT_HOST: tcp://buildkit.arc-runners.svc.cluster.local:1234

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag
        id: tag
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          echo "value=${DATE}.${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up buildx (remote driver -> in-cluster buildkit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: ${{ env.BUILDKIT_HOST }}

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          # Build context is the controller subdir (where the
          # Dockerfile expects to find bot/ and etc/).
          context: server-controller
          file: server-controller/etc/Dockerfile
          # In-cluster only — single arch is sufficient and avoids
          # quadrupling the registry payload via multi-arch manifests.
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          build-args: |
            DEPLOY_STRATEGY=kubernetes
            STARTER=discord
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
